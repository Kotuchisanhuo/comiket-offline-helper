<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e8f82" />
    <title>夏コミ现场助手</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9m0 0 5 5m-5-5-5 5M5 3h14" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2.2 2.2 0 0 0-3.1-3.1l-10 10L4 20Zm11-13 3 3" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2m-8 0 1 13h8l1-13M10 11v5m4-5v5" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><path d="M6 18a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm12-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8.5 15h4a3.5 3.5 0 0 0 0-7H9" /></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" /></symbol>
      <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7h15a1 1 0 0 1 1 1v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7Zm0 0a3 3 0 0 1 3-3h11v3M16 13h4" /></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6V3Zm8 0v4h4M9 11h6M9 15h6" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.2-4.2M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18" /></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="m9 18-5 3V6l5-3 6 3 5-3v15l-5 3-6-3Zm0 0V3m6 18V6" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><path d="M8 8h11v11H8V8Zm-3 8H4V4h12v1" /></symbol>
      <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" /></symbol>
      <symbol id="i-zoom-in" viewBox="0 0 24 24"><path d="m21 21-4.2-4.2M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm0-10.5v6m-3-3h6" /></symbol>
      <symbol id="i-zoom-out" viewBox="0 0 24 24"><path d="m21 21-4.2-4.2M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm-3-7.5h6" /></symbol>
    </svg>

    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow" data-i18n="app.eyebrow">Offline Summer Comiket Kit</p>
          <h1 data-i18n="app.title">夏コミ现场助手</h1>
        </div>
        <div class="header-actions">
          <span class="offline-pill" data-i18n="app.localSave">本地保存</span>
          <div class="language-switch" id="languageSwitch" role="group" aria-label="UI language"></div>
          <button class="icon-button" id="resetDemoBtn" type="button" title="恢复示例数据" aria-label="恢复示例数据" data-i18n-title="a11y.restoreDemo" data-i18n-aria-label="a11y.restoreDemo">
            <svg><use href="#i-copy" /></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="dashboard" aria-label="今日概况" data-i18n-aria-label="a11y.dashboard">
          <article class="next-card">
            <p class="section-label" data-i18n="section.nextTarget">下一个目标</p>
            <h2 id="nextTargetTitle">还没有待访摊位</h2>
          </article>

          <article class="metric-card">
            <p class="section-label" data-i18n="section.budget">预算</p>
            <div class="metric-row">
              <strong id="spentAmount">¥0</strong>
              <span id="budgetAmount">/ ¥0</span>
            </div>
            <div class="budget-bar" aria-hidden="true">
              <span id="budgetFill"></span>
            </div>
            <p id="budgetHint" data-i18n="budget.initialHint">设定预算后会显示剩余额度。</p>
            <label class="budget-cap-field">
              <span data-i18n="budget.cap">总预算</span>
              <input id="budgetCapInput" type="number" min="0" step="100" inputmode="numeric" />
            </label>
          </article>
        </section>

        <div class="day-switch" id="daySwitch" role="group" aria-label="日程切换" data-i18n-aria-label="a11y.daySwitch"></div>

        <nav class="tabs" aria-label="主要视图" data-i18n-aria-label="a11y.mainViews">
          <button class="tab-button active" data-tab="route" type="button">
            <svg><use href="#i-route" /></svg>
            <span data-i18n="tab.route">路线</span>
          </button>
          <button class="tab-button" data-tab="map" type="button">
            <svg><use href="#i-map" /></svg>
            <span data-i18n="tab.map">地图</span>
          </button>
          <button class="tab-button" data-tab="notes" type="button" hidden aria-hidden="true" tabindex="-1">
            <svg><use href="#i-note" /></svg>
            <span data-i18n="tab.notes">备忘</span>
          </button>
        </nav>

        <section class="view active" id="routeView" aria-labelledby="routeTitle">
          <div class="view-heading">
            <div>
              <p class="section-label">Route</p>
              <h2 id="routeTitle">现场路线</h2>
            </div>
            <div class="view-actions">
              <button class="primary-button" id="addCircleBtn" type="button">
                <svg><use href="#i-plus" /></svg>
                <span data-i18n="route.addCircle">新增摊位</span>
              </button>
              <button class="secondary-button" id="addItemBtn" type="button">
                <svg><use href="#i-plus" /></svg>
                <span data-i18n="route.addItem">购买物</span>
              </button>
            </div>
          </div>

          <div class="filter-strip">
            <label class="search-box">
              <svg><use href="#i-search" /></svg>
              <input id="searchInput" type="search" placeholder="搜索摊位、作品、备注" autocomplete="off" data-i18n-placeholder="search.placeholder" />
            </label>
            <select id="hallFilter" aria-label="馆区筛选" data-i18n-aria-label="filter.hall">
              <option value="all">全部场馆（当日）</option>
            </select>
            <select id="statusFilter" aria-label="状态筛选" data-i18n-aria-label="filter.status">
              <option value="open">待访</option>
              <option value="all">全部状态</option>
              <option value="bought">已购入</option>
              <option value="visited">已到摊</option>
              <option value="skipped">跳过</option>
            </select>
          </div>

          <div class="route-list" id="routeList"></div>
        </section>

        <section class="view" id="mapView" aria-labelledby="mapTitle">
          <div class="view-heading">
            <div>
              <p class="section-label">Map</p>
              <h2 id="mapTitle" data-i18n="map.heading">离线场馆导航</h2>
            </div>
          </div>

          <div class="map-layout">
            <div class="venue-map-panel">
              <div class="catalog-map-controls">
                <div class="catalog-map-toolbar" id="catalogMapTabs"></div>
                <div class="map-zoom-controls" aria-label="地图缩放" data-i18n-aria-label="map.zoomControls">
                  <button class="icon-button compact-icon-button" id="mapZoomOutBtn" type="button" title="缩小地图" aria-label="缩小地图" data-i18n-title="map.zoomOut" data-i18n-aria-label="map.zoomOut">
                    <svg><use href="#i-zoom-out" /></svg>
                  </button>
                  <button class="mini-button map-zoom-value" id="mapZoomResetBtn" type="button" title="恢复 100%" aria-label="恢复 100%" data-i18n-title="map.zoomReset" data-i18n-aria-label="map.zoomReset">100%</button>
                  <button class="icon-button compact-icon-button" id="mapZoomInBtn" type="button" title="放大地图" aria-label="放大地图" data-i18n-title="map.zoomIn" data-i18n-aria-label="map.zoomIn">
                    <svg><use href="#i-zoom-in" /></svg>
                  </button>
                </div>
              </div>
              <div class="catalog-map-frame">
                <div class="pin-mode-bar" id="pinModeBar" hidden>
                  <span id="pinModeLabel" data-i18n="map.pinModeIdle">定位中</span>
                  <button class="mini-button" id="clearPinModeBtn" type="button" data-i18n="map.clear">清除</button>
                  <button class="mini-button" id="cancelPinModeBtn" type="button" data-i18n="map.cancel">取消</button>
                </div>
                <div class="catalog-map-layer" id="catalogMapLayer">
                  <img id="catalogMapImage" alt="Comike WebCatalog 场馆地图" data-i18n-alt="map.imageAlt" />
                  <div class="map-marker-layer" id="catalogMapMarkers" aria-label="路线定位点" data-i18n-aria-label="map.markerLayer"></div>
                </div>
              </div>
            </div>
            <aside class="map-side-panel">
              <div class="map-route-steps" id="mapRouteSteps"></div>
            </aside>
          </div>
        </section>

        <section class="view" id="notesView" aria-labelledby="notesTitle" hidden>
          <div class="view-heading">
            <div>
              <p class="section-label">Notes</p>
              <h2 id="notesTitle" data-i18n="notes.heading">现场备忘</h2>
            </div>
          </div>

          <div class="packing-panel">
            <div class="panel-title-row">
              <h3 data-i18n="packing.heading">携带物检查</h3>
              <form id="packingForm" class="inline-form">
                <input id="packingInput" type="text" placeholder="新增物品" data-i18n-placeholder="packing.placeholder" />
                <button class="icon-button" type="submit" title="新增物品" aria-label="新增物品" data-i18n-title="packing.add" data-i18n-aria-label="packing.add">
                  <svg><use href="#i-plus" /></svg>
                </button>
              </form>
            </div>
            <div class="packing-list" id="packingList"></div>
          </div>

          <div class="memo-grid">
            <label>
              <span data-i18n="notes.meeting">集合地点</span>
              <textarea id="meetingMemo" rows="4"></textarea>
            </label>
            <label>
              <span data-i18n="notes.transit">交通与入场</span>
              <textarea id="transitMemo" rows="4"></textarea>
            </label>
            <label>
              <span data-i18n="notes.emergency">紧急联络 / 失物</span>
              <textarea id="emergencyMemo" rows="4"></textarea>
            </label>
            <label>
              <span data-i18n="notes.after">结束后安排</span>
              <textarea id="afterMemo" rows="4"></textarea>
            </label>
          </div>
        </section>
      </main>
    </div>

    <dialog id="circleDialog" class="circle-dialog">
      <form id="circleForm">
        <div class="dialog-heading">
          <div>
            <p class="section-label">Circle</p>
            <h2 id="dialogTitle">新增摊位</h2>
          </div>
          <button class="icon-button" id="closeDialogBtn" type="button" title="关闭" aria-label="关闭" data-i18n-title="dialog.close" data-i18n-aria-label="dialog.close">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>

        <input id="circleId" type="hidden" />
        <div class="form-grid">
          <label>
            <span data-i18n="form.day">日程</span>
            <select id="circleDay" required>
              <option value="day1">第一日</option>
              <option value="day2">第二日</option>
            </select>
          </label>
          <label>
            <span data-i18n="form.hall">馆区</span>
            <select id="circleHall" required></select>
          </label>
          <label>
            <span data-i18n="form.space">摊位号</span>
            <input id="circleSpace" type="text" placeholder="例：東A-12a" required data-i18n-placeholder="form.spacePlaceholder" />
          </label>
          <label class="wide">
            <span data-i18n="form.circleName">社团 / 作者</span>
            <input id="circleName" type="text" placeholder="社团名或作者名" required data-i18n-placeholder="form.circleNamePlaceholder" />
          </label>
          <label>
            <span data-i18n="form.priority">优先级</span>
            <select id="circlePriority">
              <option value="A">A 必去</option>
              <option value="B">B 想去</option>
              <option value="C">C 有空再去</option>
            </select>
          </label>
          <label>
            <span data-i18n="form.status">状态</span>
            <select id="circleStatus">
              <option value="plan">待访</option>
              <option value="visited">已到摊</option>
              <option value="bought">已购入</option>
              <option value="skipped">跳过</option>
            </select>
          </label>
          <label class="wide">
            <span data-i18n="form.note">备注</span>
            <textarea id="circleNote" rows="3" placeholder="排队策略、交换约定、注意事项" data-i18n-placeholder="form.circleNotePlaceholder"></textarea>
          </label>
        </div>

        <div class="dialog-actions">
          <button class="secondary-button" id="deleteCircleBtn" type="button">
            <svg><use href="#i-trash" /></svg>
            <span data-i18n="action.delete">删除</span>
          </button>
          <button class="primary-button" type="submit">
            <svg><use href="#i-check" /></svg>
            <span data-i18n="action.save">保存</span>
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="itemDialog" class="item-dialog">
      <form id="itemForm">
        <div class="dialog-heading">
          <div>
            <p class="section-label">Item</p>
            <h2 id="itemDialogTitle">新增购买物</h2>
          </div>
          <button class="icon-button" id="closeItemDialogBtn" type="button" title="关闭" aria-label="关闭" data-i18n-title="dialog.close" data-i18n-aria-label="dialog.close">
            <svg><use href="#i-close" /></svg>
          </button>
        </div>

        <input id="itemCircleId" type="hidden" />
        <input id="itemId" type="hidden" />
        <div class="form-grid">
          <label class="wide">
            <span data-i18n="form.itemCircle">所属社团</span>
            <select id="itemCircleSelect" required></select>
          </label>
          <label class="wide">
            <span data-i18n="form.itemName">购买物</span>
            <input id="itemName" type="text" placeholder="新刊、周边、签名等" required data-i18n-placeholder="form.itemNamePlaceholder" />
          </label>
          <label>
            <span data-i18n="form.qty">数量</span>
            <input id="itemQty" type="number" min="1" step="1" inputmode="numeric" required />
          </label>
          <label>
            <span data-i18n="form.unitPrice">单价</span>
            <input id="itemUnitPrice" type="number" step="any" inputmode="decimal" />
          </label>
          <label class="checkbox-row wide">
            <input id="itemBought" type="checkbox" />
            <span data-i18n="form.bought">已购入</span>
          </label>
          <label class="wide">
            <span data-i18n="form.note">备注</span>
            <textarea id="itemNote" rows="3" placeholder="版本、特典、代购、交换约定" data-i18n-placeholder="form.itemNotePlaceholder"></textarea>
          </label>
        </div>

        <div class="dialog-actions">
          <button class="secondary-button" id="deleteItemBtn" type="button">
            <svg><use href="#i-trash" /></svg>
            <span data-i18n="action.delete">删除</span>
          </button>
          <button class="primary-button" type="submit">
            <svg><use href="#i-check" /></svg>
            <span data-i18n="action.save">保存</span>
          </button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
